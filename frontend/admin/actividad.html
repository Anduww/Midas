<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" data-required-role="admin_super">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        document.documentElement.style.visibility = "hidden";
    </script>
    <script src="../js/auth/guard.js?v=20261118-guard-actividad"></script>
    <title>MIDAS · Registro de actividad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg?v=20261029-midas-gold">
    <link href="../css/buttons.css" rel="stylesheet">
    <link href="../css/app.css?v=20261029-transicion-suave" rel="stylesheet">
    <style>
        :root, [data-bs-theme="dark"] {
            --bs-body-bg: #06111f;
            --bs-body-color: #e4edf5;
            --bs-emphasis-color: #f5fbff;
            --bs-secondary-color: #a9bdcc;
            --bs-secondary-bg: #0a1a2b;
            --bs-tertiary-bg: #0d2235;
            --bs-border-color: #18384c;
            --bs-primary: #00cfe8;
            --bs-primary-rgb: 0, 207, 232;
            --bs-info: #00d9e8;
            --bs-info-rgb: 0, 217, 232;
        }

        body { background: #030b15; }

        #numeroPagina { width: 4.5rem; text-align: center; }

        .paginacion-actividad .btn { min-width: 2.5rem; }
    </style>
</head>
<body>
    <nav class="navbar bg-body border-bottom border-secondary-subtle px-3 px-lg-4 py-3">
        <a href="panel.html" class="navbar-brand d-flex align-items-center gap-2 fw-bold text-warning mb-0">
            <img src="../assets/logo.svg" alt="" width="30" height="30">MIDAS
        </a>
        <a href="panel.html" class="btn btn-sm btn-outline-info">
            <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver al panel
        </a>
    </nav>

    <main class="container-fluid px-3 px-lg-4 py-4">
        <header class="mb-4">
            <h1 class="h3 fw-bold mb-1">Registro de actividad</h1>
            <p class="text-body-secondary mb-0">Consulta las acciones administrativas registradas en MIDAS.</p>
        </header>

        <section class="card" aria-label="Actividad registrada">
            <div class="card-header">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-lg">
                        <label for="texto" class="form-label small">Buscar actividad</label>
                        <input id="texto" type="search" class="form-control"
                            placeholder="Persona, acción, entidad o detalle">
                    </div>
                    <div class="col-12 col-sm-6 col-lg-2">
                        <label for="desde" class="form-label small">Desde</label>
                        <input id="desde" type="date" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-lg-2">
                        <label for="hasta" class="form-label small">Hasta</label>
                        <input id="hasta" type="date" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-lg-2">
                        <label for="orden" class="form-label small">Orden</label>
                        <select id="orden" class="form-select">
                            <option value="desc">Más recientes</option>
                            <option value="asc">Más antiguos</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-auto">
                        <button id="btnBuscar" class="btn btn-info w-100" type="button">
                            <i class="bi bi-search me-1" aria-hidden="true"></i>Buscar
                        </button>
                    </div>
                    <div class="col-12 col-lg-auto ms-lg-auto text-lg-end">
                        <span id="contador" class="small text-body-secondary" aria-live="polite"></span>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="text-nowrap">
                        <tr>
                            <th scope="col">N°</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Persona</th>
                            <th scope="col">Acción</th>
                            <th scope="col">Detalle</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo">
                        <tr><td class="text-body-secondary py-4 text-center" colspan="5">Cargando actividad…</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-3">
                <span id="estadoPagina" class="small text-body-secondary" aria-live="polite"></span>
                <div class="paginacion-actividad d-flex align-items-center gap-2"
                    aria-label="Paginación del registro de actividad">
                    <button id="primeraPagina" class="btn btn-sm btn-outline-info" type="button"
                        aria-label="Ir a la primera página" title="Primera página">&lt;&lt;</button>
                    <button id="paginaAnterior" class="btn btn-sm btn-outline-info" type="button"
                        aria-label="Página anterior" title="Anterior">&lt;</button>
                    <label class="small text-body-secondary d-flex align-items-center gap-2" for="numeroPagina">
                        Página
                        <input id="numeroPagina" class="form-control form-control-sm" type="number" min="1"
                            value="1" inputmode="numeric">
                        <span>de <strong id="totalPaginas">1</strong></span>
                    </label>
                    <button id="paginaSiguiente" class="btn btn-sm btn-outline-info" type="button"
                        aria-label="Página siguiente" title="Siguiente">&gt;</button>
                    <button id="ultimaPagina" class="btn btn-sm btn-outline-info" type="button"
                        aria-label="Ir a la última página" title="Última página">&gt;&gt;</button>
                </div>
            </div>
        </section>
    </main>

    <script defer src="../js/admin/actividad.js?v=20261118-actividad"></script>
</body>
</html>
