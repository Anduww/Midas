<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MIDAS · Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg?v=20261029-midas-gold">
    <link href="../css/buttons.css" rel="stylesheet">
    <style>
        .transicion-sonda {
            position: fixed;
            z-index: 2000;
            inset: 0;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 50% 45%, rgba(0, 217, 232, .13), transparent 30rem),
                rgba(3, 11, 21, .97);
            opacity: 0;
            visibility: hidden;
            transition: opacity .55s ease, visibility .55s ease;
        }

        .transicion-sonda.conectando {
            opacity: 1;
            visibility: visible;
        }

        .transicion-sonda-contenido {
            width: min(22rem, calc(100vw - 3rem));
            text-align: center;
            animation: sonda-aparecer .7s cubic-bezier(.2, .8, .2, 1) both;
        }

        .transicion-sonda-logo {
            width: min(12rem, 65vw);
            filter: drop-shadow(0 0 1.5rem rgba(0, 217, 232, .22));
            animation: sonda-resplandor 2.4s ease-in-out infinite;
        }

        .transicion-sonda-titulo {
            margin: 2rem 0 .4rem;
            color: #f5fbff;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: .02em;
        }

        .transicion-sonda-mensaje { color: #a9bdcc; font-size: .9rem; }

        .transicion-sonda-progreso {
            width: 10rem;
            height: 2px;
            margin: 1.5rem auto 0;
            overflow: hidden;
            border-radius: 2px;
            background: rgba(169, 189, 204, .18);
        }

        .transicion-sonda-progreso::after {
            display: block;
            width: 45%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, transparent, #00d9e8, #f5fbff, transparent);
            content: "";
            animation: sonda-progreso 1.25s ease-in-out infinite;
        }

        @keyframes sonda-aparecer {
            from { opacity: 0; transform: translateY(12px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes sonda-resplandor {
            50% { filter: drop-shadow(0 0 2.1rem rgba(0, 217, 232, .42)); }
        }

        @keyframes sonda-progreso {
            from { transform: translateX(-120%); }
            to { transform: translateX(250%); }
        }

        @media (prefers-reduced-motion: reduce) {
            .transicion-sonda, .transicion-sonda-contenido, .transicion-sonda-logo,
            .transicion-sonda-progreso::after { animation: none; transition-duration: .15s; }
        }
    </style>
    <link href="../css/app.css?v=20261029-auth-refresh" rel="stylesheet">
</head>
<body class="auth-page">
    <div id="transicionSonda" class="transicion-sonda" role="status" aria-live="polite" aria-hidden="true">
        <div class="transicion-sonda-contenido">
            <img class="transicion-sonda-logo" src="../assets/sonda.svg" alt="SONDA">
            <div class="transicion-sonda-titulo">Bienvenido a MIDAS</div>
            <div class="transicion-sonda-mensaje">Preparando tu espacio de trabajo</div>
            <div class="transicion-sonda-progreso" aria-hidden="true"></div>
        </div>
    </div>
    <main class="auth-layout">
        <section class="card auth-card">
            <div class="card-body">
                <header class="auth-brand">
                    <img class="auth-logo" src="../assets/midas-emblema.svg" alt="MIDAS, el toque de oro">
                    <p class="auth-kicker">Plataforma de proyectos</p>
                    <h1 class="auth-title">Iniciar sesión</h1>
                    <p class="auth-description">Accede a tu espacio de trabajo</p>
                </header>

                <form id="formLogin">
                    <div class="auth-field">
                        <label class="form-label auth-label" for="email">Correo</label>
                        <input id="email" type="email" class="form-control" autocomplete="username" placeholder="usuario@sonda.com" required>
                    </div>
                    <div class="auth-field">
                        <label class="form-label auth-label" for="password">Contraseña</label>
                        <input id="password" type="password" class="form-control" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
                    </div>

                    <button id="btnLogin" type="submit" class="btn auth-submit w-100">Iniciar sesión</button>
                </form>
                <div class="auth-footer">
                    ¿Aún no tienes cuenta?
                    <a class="ms-1" href="registro.html">Crear cuenta</a>
                </div>
            </div>
        </section>
    </main>
    <script src="../js/toast.js"></script>
    <script src="../js/auth/login.js?v=20261029-auth-refresh"></script>
</body>
</html>
