<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MIDAS · Crear cuenta</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg?v=20261029-midas-gold">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/buttons.css" rel="stylesheet">
    <link href="../css/app.css?v=20261029-auth-refresh" rel="stylesheet">
</head>
<body class="auth-page">
    <main class="auth-layout">
        <section class="card auth-card">
            <div class="card-body">
                <header class="auth-brand">
                    <img class="auth-logo" src="../assets/midas-emblema.svg" alt="MIDAS, el toque de oro">
                    <p class="auth-kicker">Plataforma de proyectos</p>
                    <h1 class="auth-title">Crear cuenta</h1>
                    <p class="auth-description">Solicita acceso a tu espacio de trabajo</p>
                </header>

                <form id="formRegistro">
                    <div class="auth-field">
                        <label class="form-label auth-label" for="nombre">Nombre</label>
                        <input id="nombre" type="text" class="form-control" autocomplete="name" maxlength="100" required>
                    </div>
                    <div class="auth-field">
                        <label class="form-label auth-label" for="email">Correo</label>
                        <input id="email" type="email" class="form-control" autocomplete="username" maxlength="150" placeholder="usuario@sonda.com" required>
                    </div>
                    <div class="auth-field">
                        <label class="form-label auth-label" for="password">Contraseña</label>
                        <input id="password" type="password" class="form-control" autocomplete="new-password" minlength="8" aria-describedby="ayudaPassword" required>
                        <div id="ayudaPassword" class="form-text">Usa al menos 8 caracteres.</div>
                    </div>
                    <div class="auth-field">
                        <label class="form-label auth-label" for="password2">Confirmar contraseña</label>
                        <input id="password2" type="password" class="form-control" autocomplete="new-password" minlength="8" required>
                    </div>

                    <button id="btnRegistro" type="submit" class="btn auth-submit w-100">Crear cuenta</button>
                </form>
                <p class="auth-note">
                    <i class="bi bi-info-circle-fill" aria-hidden="true"></i>
                    <span>Tu solicitud quedará pendiente hasta que un administrador apruebe la cuenta.</span>
                </p>
                <div class="auth-footer">
                    ¿Ya tienes cuenta?
                    <a class="ms-1" href="login.html">Inicia sesión</a>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/auth/registro.js?v=20261125-sonda-email"></script>
</body>
</html>
